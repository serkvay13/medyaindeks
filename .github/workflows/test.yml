name: test

on:
  push:
    branches: [main, "platform/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements-platform.txt
          pip install "streamlit>=1.64"
      - name: Testler (ağsız, offline LLM sağlayıcısı)
        env:
          MEDYA_LLM_SAGLAYICI: offline
        run: python -m pytest -q
